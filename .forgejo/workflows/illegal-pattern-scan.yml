name: Illegal Pattern Scan

# Enforces R1: scraping fleet uses approved evasion techniques only.
# Strategy B (2026-05-16): curl_cffi TLS impersonation + Camoufox + residential proxies
# are APPROVED. Outdated/dangerous patterns remain blocked.
# Historical policy archived. planning/ directory removed.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  illegal-pattern-scan:
    name: R1 — Illegal pattern check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── CS-0-1: Block outdated/dangerous evasion patterns ─────────────
      # APPROVED: curl_cffi, camoufox, impersonate=, residential proxies (Decodo/Oxylabs)
      # BLOCKED:  playwright-stealth (outdated), undetected-chromedriver (outdated),
      #           fake-useragent lib, scrapingbee/scraperapi (not chosen), brightdata (not chosen)
      - name: CS-0-1 · Blocked evasion patterns
        run: |
          MATCHES=$(grep -rnE \
            "(playwright[._-]stealth|scrapingbee|scraperapi|brightdata|\
StealthClient|StealthBrowser|StealthHTTPHelper|StealthEngine|\
undetected[._]chromedriver|puppeteer[._]stealth|user[._]agent[._]spoof|\
FakeChromeUA|bypass[._]cloudflare|fake[._]useragent)" \
            --include="*.go" --include="*.py" --include="*.js" \
            --include="*.ts" --include="*.rs" \
            --exclude-dir=node_modules --exclude-dir=vendor \
            --exclude-dir=target --exclude-dir=.git \
                        . 2>/dev/null || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ CS-0-1 FAILED: Blocked evasion patterns detected:"
            echo "$MATCHES"
            echo ""
            echo "Approved stack: curl_cffi>=0.15.1 + camoufox + Decodo/Oxylabs proxies + CapSolver."
            exit 1
          fi
          echo "✓ CS-0-1 PASS — no blocked patterns"

      # ── CS-0-2: Blacklisted dependencies ─────────────────────────────
      # APPROVED: curl_cffi, camoufox, capsolver
      # BLOCKED:  playwright-stealth, undetected-chromedriver, fake-useragent,
      #           scrapingbee, brightdata (not in approved vendor list)
      - name: CS-0-2 · Blacklisted dependencies
        run: |
          MANIFESTS=$(find . \
            -name "requirements*.txt" -o \
            -name "pyproject.toml" -o \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/vendor/*" \
            2>/dev/null)

          MATCHES=$(grep -lE \
            "(playwright[._-]stealth|2captcha|scrapingbee|brightdata|\
undetected[._-]chromedriver|fake[._-]useragent|\
puppeteer-extra-plugin-stealth|playwright-extra)" \
            $MANIFESTS 2>/dev/null || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ CS-0-2 FAILED: Blacklisted packages in dependencies:"
            echo "$MATCHES"
            echo "Approved: curl_cffi>=0.15.1, camoufox[geoip], capsolver"
            exit 1
          fi
          echo "✓ CS-0-2 PASS — no blacklisted dependencies"

      # ── CS-0-3: CardexBot UA in Go modules; scrapers/ uses impersonation ──
      # discovery/, extraction/, quality/ must use CardexBot/1.0.
      # scrapers/ uses curl_cffi TLS impersonation — UA set automatically by
      # the fingerprint engine, not as a literal string. Excluded from this check.
      - name: CS-0-3 · CardexBot UA in Go services
        run: |
          # Go services must use CardexBot UA
          LITERAL_VIOLATIONS=$(grep -rnE '"User-Agent"\s*[=:{]\s*"(?!.*Cardex)[^"]+"' \
            --include="*.go" \
            --exclude-dir=.git             . 2>/dev/null || true)

          if [ -n "$LITERAL_VIOLATIONS" ]; then
            echo "❌ CS-0-3 FAILED: Non-CardexBot User-Agent in Go service:"
            echo "$LITERAL_VIOLATIONS"
            exit 1
          fi

          # Go UA constants must resolve to CardexBot
          UA_CONSTANTS=$(grep -rn "cardexUA\s*=\|CARDEX_UA\s*=\|_USER_AGENT\s*=" \
            --include="*.go" \
            --exclude-dir=.git             . 2>/dev/null || true)

          NON_CARDEX=$(echo "$UA_CONSTANTS" | grep -v "CardexBot" || true)
          if [ -n "$NON_CARDEX" ]; then
            echo "❌ CS-0-3 FAILED: Go UA constant not set to CardexBot:"
            echo "$NON_CARDEX"
            exit 1
          fi

          echo "✓ CS-0-3 PASS — Go services use CardexBot UA"
          echo "  Note: scrapers/ uses curl_cffi impersonation — UA managed by fingerprint engine"

      # ── CS-0-4: robots.txt compliance checker exists and is wired ─────
      - name: CS-0-4 · robots.txt compliance operational
        run: |
          CHECKER=$(grep -rn "RobotsChecker\|robots_checker\|can_fetch" \
            --include="*.go" --include="*.py" \
            --exclude-dir=.git             . 2>/dev/null | head -1)

          if [ -z "$CHECKER" ]; then
            echo "❌ CS-0-4 FAILED: RobotsChecker not found in active code"
            exit 1
          fi
          echo "✓ CS-0-4 PASS — RobotsChecker wired"
          echo "  $CHECKER"

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with: { go-version: '1.26.2' }

      - name: go mod verify — supply chain integrity (#42)
        run: |
          for mod in discovery extraction quality; do
            echo "=== go mod verify: $mod ==="
            (cd "$mod" && go mod verify)
          done

      - name: govulncheck — all modules (#50)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in discovery extraction quality; do
            echo "=== govulncheck: $mod ==="
            (cd "$mod" && govulncheck ./...)
          done

      - name: pip-audit (Python deps si hay)
        run: |
          pip install pip-audit
          for req in $(find . -name "requirements.txt"); do
            pip-audit -r "$req" || true
          done

      # ── Deleted files check: ensure purged files stay deleted ─────────
      - name: Purge guard · Ensure stealth files not re-introduced
        run: |
          ILLEGAL_FILES=(
            "scrapers/dealer_spider/stealth_http.py"
            "scrapers/dealer_spider/stealth_browser.py"
            "scrapers/common/proxy_manager.py"
            "scrapers/dealer_spider/recon_oem.py"
          )

          FOUND=0
          for f in "${ILLEGAL_FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "❌ PURGE GUARD: $f re-introduced — must not exist"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "✓ PURGE GUARD PASS — all purged files remain deleted"
