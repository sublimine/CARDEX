  # ── Layer 5 · Web-scale (aux, complemento) ───────────────────────────────────────────────
  common_crawl:
    module: scrapers.discovery.sources.common_crawl
    layer: 5
    role: aux
    countries: [DE, FR, ES, NL, BE, CH]
    rank: 6
    census_authority: false
