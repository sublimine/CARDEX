<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Server error</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Inter:wght@300;400;500&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <style>
        html:root {
            --color-bg: #3519ff;
            --color-text: #F6F6F6;
            --color-accent: #3519ff;
            --color-accent-secondary: #edfb1b;

        }
        html {
            font-size: 15px;
        }
        body {
            font-family: 'Hanken Grotesk', Arial, sans-serif;
            font-size: 1rem;
            background: var(--color-bg);
            margin: 0;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 990px;
            margin: 0 auto;
            height: 100vh;
            flex-direction: column;
        }
        h1, h2, h3 {
            color: var(--color-primary-text);
            display: flex;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.667rem;
            font-weight: 300;
        }
        h2 {
            font-size: 1.0667rem;
            font-weight: 400;
        }
        h3 {
            font-size: 1.333rem;
            font-weight: 600;
            margin-top: 3rem;
        }
        .btn {
            margin-top: 3rem;
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--color-accent-secondary);
            color: var(--color-accent);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
        <div class="container">
        <h1>404</h1>
        <h2>Pagina niet gevonden &#129488;</h2>
        <h3>
                            Onze excuses, we kunnen de gevraagde pagina niet vinden.
                    </h3>

        <a href="/" class="btn">Ga naar de website</a>
    </div>
</body>
</html>
